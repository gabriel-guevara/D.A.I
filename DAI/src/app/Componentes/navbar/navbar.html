<header class="h-16 bg-white border-b border-slate-200 flex items-center justify-end-safe px-6 gap-4">
  <div class="relative flex-1 max-w-md mr-200">
    <button
      type="button"
      (click)="onSearchSubmit()"
      class="absolute inset-y-0 left-3 flex items-center text-slate-400 hover:text-blue-600"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="m21 21-4.34-4.34M18 10.5a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" />
      </svg>
    </button>
    <input type="text" placeholder="Buscar documentos, metadatos, folios..."
      [ngModel]="searchQuery()"
      (ngModelChange)="searchQuery.set($event)"
      (keydown.enter)="onSearchSubmit()"
      class="w-full pl-9 pr-3 py-2 rounded-lg bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
  </div>

  <button
    type="button"
    (click)="nuevoDocumento()"
    class="bg-blue-700 hover:bg-blue-800 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-1.5 shrink-0">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
    </svg>
    Nuevo Documento
  </button>

  <div class="flex items-center gap-2 pl-3 border-l border-slate-200 shrink-0 mr-8">
    <div
      class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 text-xs font-semibold">
      ER
    </div>
    <div class="hidden md:block leading-tight">
      <p class="text-1xl font-semibold text-slate-700">{{ auth.currentUser()?.name || 'Dra. Elena Ramos' }}</p>
      <p class="text-[12px] text-slate-400">{{ auth.currentUser()?.role || 'Admin Seguridad' }}</p>
    </div>
  </div>
</header>
