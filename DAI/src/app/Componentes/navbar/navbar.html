<!--
  Layout fluido (sin márgenes fijos): el buscador crece y se encoge con flex-1 + min-w-0, y el grupo de la
  derecha (Nuevo Documento + usuario + cerrar sesión) nunca se encoge (shrink-0) ni sale de la pantalla.
  En pantallas estrechas se ocultan los TEXTOS, no los botones: el logout siempre está visible.
-->
<header class="h-16 bg-white border-b border-slate-200 flex items-center gap-3 px-4 sm:px-6">
  <div class="relative flex-1 min-w-0 max-w-xl">
    <button type="button" (click)="onSearchSubmit()" aria-label="Buscar"
      class="absolute inset-y-0 left-3 flex items-center text-slate-400 hover:text-blue-600">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="m21 21-4.34-4.34M18 10.5a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" />
      </svg>
    </button>
    <input type="text" placeholder="Buscar documentos, metadatos, folios..." [ngModel]="searchQuery()"
      (ngModelChange)="searchQuery.set($event)" (keydown.enter)="onSearchSubmit()"
      class="w-full pl-9 pr-3 py-2 rounded-lg bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
  </div>

  <div class="ml-auto flex items-center gap-3 shrink-0">
    @if (puedeSubir()) {
      <button type="button" (click)="nuevoDocumento()" title="Nuevo Documento" aria-label="Nuevo Documento"
        class="bg-blue-700 hover:bg-blue-800 text-white text-sm font-medium px-3 md:px-4 py-2 rounded-lg flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        <span class="hidden md:inline">Nuevo Documento</span>
      </button>
    }

    <div class="flex items-center gap-3 pl-3 border-l border-slate-200">
      <div class="w-8 h-8 shrink-0 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 text-xs font-semibold"
        [title]="auth.currentUser()?.name ?? ''">
        {{ iniciales() }}
      </div>
      <div class="hidden lg:block leading-tight max-w-48">
        <p class="text-sm font-semibold text-slate-700 truncate">{{ auth.currentUser()?.name }}</p>
        <p class="text-[11px] text-slate-400 truncate">{{ auth.currentUser()?.role }}</p>
      </div>

      <!-- BOTÓN DE CERRAR SESIÓN -->
      <button type="button" (click)="cerrarSesion()" title="Cerrar Sesión" aria-label="Cerrar Sesión"
        class="p-2 rounded-lg text-red-400 hover:text-red-600 hover:bg-red-50 transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </button>
    </div>
  </div>
</header>
