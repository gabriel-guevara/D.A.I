<!--
  Layout fluido (sin márgenes fijos): el buscador crece y se encoge con flex-1 + min-w-0, y el grupo de la
  derecha (Nuevo Documento + tema + usuario + cerrar sesión) nunca se encoge (shrink-0) ni sale de la pantalla.
  En pantallas estrechas se ocultan los TEXTOS, no los botones: el logout siempre está visible.
-->
<header class="sticky top-0 z-30 h-16 bg-surface/90 backdrop-blur-sm border-b border-line flex items-center gap-3 px-4 sm:px-6">
  <div role="search" class="relative flex-1 min-w-0 max-w-xl">
    <button type="button" (click)="onSearchSubmit()" aria-label="Buscar"
      class="absolute inset-y-0 left-0 w-10 grid place-items-center text-ink-3 hover:text-accent transition-colors">
      <app-icono nombre="buscar" [tamano]="17" />
    </button>
    <input type="search" name="q" placeholder="Buscar documentos, metadatos, folios..." [ngModel]="searchQuery()"
      (ngModelChange)="searchQuery.set($event)" (keydown.enter)="onSearchSubmit()" aria-label="Buscar documentos"
      class="input pl-10 bg-sunken border-line" />
  </div>

  <div class="ml-auto flex items-center gap-2 shrink-0">
    @if (puedeSubir()) {
      <button type="button" (click)="nuevoDocumento()" title="Nuevo Documento" aria-label="Nuevo Documento"
        class="btn btn-primary">
        <app-icono nombre="mas" [tamano]="17" />
        <span class="hidden md:inline">Nuevo Documento</span>
      </button>
    }

    <button type="button" (click)="tema.alternar()" class="btn btn-ghost btn-icon"
      [attr.aria-label]="tema.oscuro() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      [title]="tema.oscuro() ? 'Modo claro' : 'Modo oscuro'">
      <app-icono [nombre]="tema.oscuro() ? 'sol' : 'luna'" />
    </button>

    <div class="flex items-center gap-3 pl-3 ml-1 border-l border-line">
      <div class="w-9 h-9 shrink-0 rounded-full bg-brand text-on-brand grid place-items-center text-sm font-semibold tracking-wide"
        [title]="auth.currentUser()?.name ?? ''">
        {{ iniciales() }}
      </div>
      <div class="hidden lg:block leading-tight max-w-48">
        <p class="text-base font-semibold text-ink truncate">{{ auth.currentUser()?.name }}</p>
        <p class="text-xs text-ink-3 truncate">{{ auth.currentUser()?.role }}</p>
      </div>

      <!-- BOTÓN DE CERRAR SESIÓN -->
      <button type="button" (click)="cerrarSesion()" title="Cerrar Sesión" aria-label="Cerrar Sesión"
        class="btn btn-ghost btn-icon hover:!text-danger hover:!bg-danger-soft">
        <app-icono nombre="salir" />
      </button>
    </div>
  </div>
</header>
